<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6ec8ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>수학 대륙: 여섯 마을의 봉인</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <!-- 글꼴: 게임 폴더 안 assets/fonts (나눔스퀘어라운드 · 주아) — 인터넷 글꼴 서버가 막혀도 같은 글씨 -->
  <link rel="preload" href="assets/fonts/Jua-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/NanumSquareRoundR.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/NanumSquareRoundB.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/rpg.css">
  <link rel="stylesheet" href="css/fantasy.css">
  <link rel="stylesheet" href="css/retro.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="게임 화면"></canvas>
    <div id="screen-layer"></div>
    <div id="hud" class="hidden"></div>
    <div id="touch-controls" class="hidden"></div>
    <div id="dev-panel" class="hidden"></div>
    <div id="overlay-layer"></div>
    <div id="toast-layer"></div>
    <div id="save-indicator" class="save-indicator" aria-live="polite"></div>
  </div>

  <div id="file-warning" class="file-warning hidden">
    <h2>이렇게 열면 게임이 실행되지 않아요</h2>
    <p>파일을 더블클릭해서 열면 브라우저가 게임 파일을 막아요.<br>
      아래 방법 중 하나로 열어 주세요.</p>
    <ul>
      <li>GitHub Pages 주소로 열기 (추천)</li>
      <li>VS Code의 <b>Live Server</b>로 열기</li>
    </ul>
  </div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('file-warning').classList.remove('hidden');
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
