<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14201a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>수학 대륙: 여섯 마을의 봉인</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Galmuri11'; font-weight: bold; src: url('fonts/Galmuri11-Bold.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #0d1410; overflow: hidden; touch-action: none; }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
    #game canvas { display: block; }
    .name-input {
      font-family: 'Galmuri11', sans-serif; font-size: 18px; width: 220px; padding: 8px 12px;
      border: 3px solid #e8c36a; border-radius: 6px; background: #fff8e6; color: #3a2614; outline: none; text-align: center;
    }
    #file-warning { position: fixed; inset: 0; display: none; place-items: center; background: #0d1410; color: #fff;
      font-family: sans-serif; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="file-warning">
    <div>
      <h2>이렇게 열면 게임이 실행되지 않아요</h2>
      <p>파일을 더블클릭하지 말고 GitHub Pages 주소나 VS Code의 Live Server로 열어 주세요.</p>
    </div>
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').style.display = 'grid';
  </script>
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
